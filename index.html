
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ask AI</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f5f6f9;
            font-family: Arial, sans-serif;

        background-image: url("/Users/lilmattysmacbook/Desktop/apprenticeship/webhook experiment/potter.webp");
        background-size: contain;
        background-position: right;
        background-repeat: no-repeat;
        background-attachment: fixed;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 12px;
            background: #334c73;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #answer {
            margin-top: 25px;
            max-width: 600px;
            padding: 20px;
            line-height: 1.6;
            text-align: center;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Ask AI</h1>

    <button id="askButton">Which of the 0 students is the youngest?</button>

    <div id="answer"></div>

    <script>
        const button = document.getElementById("askButton");
        const answer = document.getElementById("answer");

        button.addEventListener("click", async () => {
            button.disabled = true;
            answer.textContent = "Thinking...";

            try {
                const response = await fetch("/api/ask", {
                    method: "POST"
                });

                if (!response.ok) {
                    throw new Error("Backend request failed");
                }

                const data = await response.json();
                answer.textContent = data.answer;

            } catch (error) {
                answer.textContent =
                    "Something went wrong. Please try again.";
            } finally {
                button.disabled = false;
            }
        });


async function loadStudentCount() {
    try {
        const response = await fetch("/api/student_count");

        if (!response.ok) {
            throw new Error("Could not retrieve student count");
        }

        const data = await response.json();

        button.textContent =
            `Which of the ${data.count} students is the youngest?`;

    } catch (error) {
        button.textContent = "Ask AI";
        console.error(error);
    }
}

loadStudentCount();

    </script>

</body>
</html>
